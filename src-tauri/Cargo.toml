[package]
name = "llama-server-gui"
version = "2.0.0"
description = "Native Desktop Cockpit & Flag Configurator for llama-server & llama.cpp"
authors = ["56kLabz"]
license = "Apache-2.0"
repository = "https://github.com/56KLabz/Llama-Server-GUI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
walkdir = "2.5"
